name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Ruby ${{ matrix.ruby-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
      fail-fast: false

    env:
      COOLHAND_ENV: test
      COOLHAND_API_ENDPOINT: https://coolhand_api_endpoint
      COOLHAND_API_KEY: coolhand_api_key-xxx-yyy-zzz
      COOLHAND_SILENT: true
      COOLHAND_INTERCEPT_ADDRESSES: open-ai-host

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run RSpec tests
        run: bundle exec rspec --format documentation

      - name: Run RSpec with coverage
        if: matrix.ruby-version == '3.3'
        run: bundle exec rspec --format documentation
        env:
          COVERAGE: true

      - name: Ensure minimum coverage
        if: matrix.ruby-version == '3.3'
        run: |
          coverage=$(cat coverage/.last_run.json | jq '.result.line')
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Coverage $coverage% is below 70% threshold"
            exit 1
          fi
          echo "Coverage: $coverage%"

      - name: Upload coverage report
        if: matrix.ruby-version == '3.3'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

      - name: Audit dependencies for known vulnerabilities
        run: bundle exec bundler-audit check --update

  build:
    name: Build Gem
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build gem
        run: gem build coolhand-ruby.gemspec

      - name: Verify gem was created
        run: ls -la *.gem
